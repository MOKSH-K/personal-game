
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Game Night</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #faf9f6;
    color: #292b38;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Background decorations */

body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #ffe4d6;
    border-radius: 50%;
    filter: blur(80px);
    top: 50px;
    left: -150px;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #dce9ff;
    border-radius: 50%;
    filter: blur(90px);
    bottom: 0;
    right: -150px;
    z-index: -1;
}

/* Header */

header {
    text-align: center;
    padding: 55px 20px 25px;
}

.tag {
    display: inline-block;
    background: #fff0dc;
    color: #b77932;
    padding: 7px 18px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

header h1 {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -2px;
}

header h1 span {
    color: #e47d69;
}

header p {
    color: #858585;
    margin-top: 10px;
    font-size: 14px;
}

/* Main section */

.main {
    max-width: 1250px;
    margin: auto;
    padding: 20px 25px 60px;
}

/* Action buttons */

.actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
}

.btn {
    padding: 12px 23px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    transition: 0.25s;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px #00000015;
}

.surprise {
    background: #ed816c;
    color: white;
}

.shuffle {
    background: white;
    color: #444;
    border: 1px solid #eee;
}

/* Stats */

.stats {
    max-width: 650px;
    margin: 0 auto 35px;
    background: white;
    padding: 18px 23px;
    border-radius: 16px;
    box-shadow: 0 5px 20px #00000008;
}

.stats-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.stats-top strong {
    color: #e47d69;
}

.progress {
    height: 8px;
    background: #f0efed;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ef927d, #f5c46a);
    border-radius: 20px;
    transition: width 0.5s;
}

/* Search */

.search-box {
    max-width: 400px;
    margin: 0 auto 30px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 14px 20px;
    border: 1px solid #e9e5e1;
    background: white;
    border-radius: 13px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    transition: 0.3s;
}

.search-box input:focus {
    border-color: #ed947f;
    box-shadow: 0 0 0 4px #ed947f20;
}

/* Game grid */

.game-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
}

.game-card {
    height: 150px;
    border-radius: 17px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    border: 2px solid transparent;
    transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
    animation: appear 0.5s backwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.game-card:hover {
    transform: translateY(-8px) scale(1.035) rotate(-1deg);
    box-shadow: 0 15px 25px #00000018;
    border-color: white;
}

.game-card:active {
    transform: scale(0.94);
}

.game-card:focus-visible {
    outline: 3px solid #292b38;
    outline-offset: 3px;
}

.game-card::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    border: 2px solid #ffffff65;
    border-radius: 50%;
    right: -45px;
    top: -45px;
    transition: 0.4s;
}

.game-card:hover::before {
    transform: scale(2);
}

.card-number {
    font-size: 40px;
    font-weight: 800;
    position: relative;
    z-index: 1;
}

.card-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    opacity: 0.65;
    margin-top: 3px;
    position: relative;
    z-index: 1;
}

.game-card.visited::before,
.game-card.visited::after {
    content: "";
    position: absolute;
    width: 140%;
    height: 6px;
    top: 50%;
    left: -20%;
    right: auto;
    border: 0;
    border-radius: 999px;
    background: #292b38;
    opacity: 0;
    z-index: 2;
    transition: opacity 0.2s ease;
}

.game-card.visited::before {
    transform: rotate(45deg);
}

.game-card.visited::after {
    transform: rotate(-45deg);
}

.game-card.visited::before,
.game-card.visited::after {
    opacity: 0.8;
}

.game-card.visited {
    cursor: not-allowed;
}

.game-card.visited:hover {
    transform: none;
    box-shadow: none;
    border-color: transparent;
}

/* Random selection highlight */

.game-card.highlight {
    border: 3px solid #ed816c;
    transform: scale(1.07);
    box-shadow: 0 0 25px #ed816c80;
}

/* No results */

.no-results {
    display: none;
    text-align: center;
    color: #888;
    padding: 40px;
    grid-column: 1 / -1;
}

/* Footer */

footer {
    text-align: center;
    color: #aaa;
    padding: 30px 15px;
    font-size: 12px;
}

.placeholder-page {
    display: none;
    min-height: 100vh;
    padding: 24px;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.placeholder-box {
    animation: appear 0.5s ease both;
}

.placeholder-label {
    color: #e47d69;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
}

.placeholder-box h1 {
    margin: 14px 0 20px;
    font-size: clamp(36px, 8vw, 58px);
}

.placeholder-text {
    display: inline-block;
    padding: 16px 28px;
    border-radius: 14px;
    background: #fff0dc;
    color: #a76f42;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
}

.placeholder-box p {
    margin-top: 22px;
    color: #858585;
    font-size: 14px;
}

body.placeholder-mode > header,
body.placeholder-mode > .main,
body.placeholder-mode > footer {
    display: none;
}

body.placeholder-mode .placeholder-page {
    display: flex;
}

/* Responsive */

@media(max-width: 900px) {
    .game-container {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media(max-width: 600px) {
    .game-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .game-card {
        height: 115px;
    }

    .card-number {
        font-size: 30px;
    }

    header {
        padding-top: 35px;
    }
}

@media(max-width: 380px) {
    .game-container {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<main class="placeholder-page" id="placeholderPage" aria-live="polite"></main>

<header>
    <div class="tag">✦ THE ULTIMATE FAMILY EDITION ✦</div>

    <h1>FAMILY <span>GAME NIGHT</span></h1>

    <p>30 surprises. Endless laughter. One unforgettable night!</p>
</header>

<main class="main">

    <div class="game-container" id="gameContainer">

        <div class="no-results" id="noResults">
            No game found. Try a number from 1 to 30!
        </div>

    </div>

</main>

<footer>
    Made with ❤️ for the family. Let the games begin!
</footer>

<script>

const container = document.getElementById("gameContainer");

const colors = [
    "#e9a6b4",
    "#8bd4d5",
    "#f5c5a4",
    "#a9b9ef",
    "#f4d77d",
    "#b5d9b6",
    "#d5b6e8",
    "#f2aaa0",
    "#a8c9df",
    "#f0c2d7",
    "#f3d5a5",
    "#b4d4ca"
];

let games = Array.from({length: 30}, (_, i) => i + 1);

let visited = new Set();
const gameFromUrl = new URLSearchParams(window.location.search).get("game");
const selectedGame = Number(gameFromUrl);

function markGameVisited(number) {
    if (visited.has(number)) return;

    visited.add(number);

    const card = document.querySelector(`[data-number="${number}"]`);
    if (card) {
        disableVisitedCard(card, number);
        card.querySelector(".card-text").textContent = "ALREADY OPENED";
    }

    updateStats();
}

function disableVisitedCard(card, number) {
    card.classList.add("visited");
    card.setAttribute("aria-disabled", "true");
    card.setAttribute("aria-label", `Game ${number} already opened`);
    card.removeAttribute("href");
    card.removeAttribute("target");
    card.tabIndex = -1;
}

function createCards() {

    container.innerHTML = "";

    games.forEach((number, index) => {

        const card = document.createElement("a");

        card.className = "game-card";
        const gameUrl = new URL(window.location.href);
        gameUrl.searchParams.set("game", number);
        card.href = gameUrl.href;
        card.target = "_blank";
        card.rel = "noopener";
        card.setAttribute("aria-label", `Open game ${number} in a new tab`);

        card.dataset.number = number;

        card.style.backgroundColor =
            colors[(index) % colors.length];

        card.style.animationDelay = `${index * 0.025}s`;

        if (visited.has(number)) {
            disableVisitedCard(card, number);
        }

        card.innerHTML = `
            <div class="card-number">${number}</div>
            <div class="card-text">${visited.has(number) ? "ALREADY OPENED" : "TAP TO EXPLORE"}</div>
        `;

        card.addEventListener("click", event => {
            if (visited.has(number)) {
                event.preventDefault();
                return;
            }

            event.preventDefault();
            openGame(number);
        });

        container.appendChild(card);

    });

    const noResults = document.createElement("div");
    noResults.className = "no-results";
    noResults.id = "noResults";
    noResults.textContent = "No games found! Try another number.";

    container.appendChild(noResults);

    updateStats();
    searchGames();
}

function updateStats() {

    const count = visited.size;
    const counter = document.getElementById("counter");
    const progressFill = document.getElementById("progressFill");

    if (counter) {
        counter.textContent = `${count} / 30`;
    }

    if (progressFill) {
        progressFill.style.width = `${(count / 30) * 100}%`;
    }
}

function showPlaceholder(number) {
    document.body.classList.add("placeholder-mode");
    document.title = `Family Game ${number}`;
    document.getElementById("placeholderPage").innerHTML = `
        <div class="placeholder-box">
            <div class="placeholder-label">FAMILY GAME NIGHT</div>
            <h1>Game ${number}</h1>
            <div class="placeholder-text">TO BE DECIDED</div>
            <p>Something exciting is coming soon!</p>
        </div>
    `;
}

// Open a randomly selected game from the surprise button.
function openGame(number) {
    if (visited.has(number)) return;

    const gameUrl = new URL(window.location.href);
    gameUrl.searchParams.set("game", number);
    window.open(gameUrl.href, "_blank", "noopener");
    markGameVisited(number);
}

// Random game selection

function surpriseMe() {

    const availableGames = games.filter(number => !visited.has(number));
    if (availableGames.length === 0) return;

    const randomNumber =
        availableGames[Math.floor(Math.random() * availableGames.length)];

    const card = document.querySelector(
        `[data-number="${randomNumber}"]`
    );

    if (!card) return;

    card.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    card.classList.add("highlight");
    openGame(randomNumber);
    setTimeout(() => card.classList.remove("highlight"), 900);

}

// Shuffle cards

function shuffleGames() {

    for (let i = games.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [games[i], games[j]] = [games[j], games[i]];

    }

    createCards();

}

// Search game number

function searchGames() {

    const searchInput = document.getElementById("searchInput");
    if (!searchInput) return;

    const value = searchInput.value;

    const cards = document.querySelectorAll(".game-card");

    let found = false;

    cards.forEach(card => {

        const match =
            value === "" ||
            card.dataset.number.includes(value);

        card.style.display = match ? "flex" : "none";

        if (match) found = true;

    });

    document.getElementById("noResults").style.display =
        found ? "none" : "block";
}

if (gameFromUrl !== null && Number.isInteger(selectedGame) && selectedGame >= 1 && selectedGame <= 30) {
    showPlaceholder(selectedGame);
} else {
    createCards();
}

</script>

</body>
</html>
